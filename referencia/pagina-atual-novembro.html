<style>
/* Layout: celular primeiro. Coluna única: próxima celebração, hoje, próximos dias. Navegação fixa embaixo, filtros recolhidos no topo. */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --surface2:#E6ECF3; --fg:#14213D; --muted:#566277; --line:#D3DBE6;
  --accent:#1F4E8C; --on-accent:#FFFFFF; --gold:#8A6410; --gold-bg:#F6EBCF;
  --heraldo:#2F6FDE; --thiago:#2E9A5B; --marcelo:#7A2F62; --gabriel:#C2571A; --adriano:#0F8A9D; --breno:#B83C8A; --tbd:#7B8798;
  --font-display:'Alegreya',Georgia,'Times New Roman',serif;
  --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 6px 20px rgba(20,33,61,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1626; --surface:#162238; --surface2:#1D2B45; --fg:#E8EDF5; --muted:#9AA8BF; --line:#2A3A58;
  --accent:#F0BC54; --on-accent:#1A1405; --gold:#E3B64F; --gold-bg:#3A2F14;
  --heraldo:#6A9BFF; --thiago:#5CCB8A; --marcelo:#C068A6; --gabriel:#F0905A; --adriano:#4FC3D6; --breno:#F074B4; --tbd:#93A0B5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1626; --surface:#162238; --surface2:#1D2B45; --fg:#E8EDF5; --muted:#9AA8BF; --line:#2A3A58;
  --accent:#F0BC54; --on-accent:#1A1405; --gold:#E3B64F; --gold-bg:#3A2F14;
  --heraldo:#6A9BFF; --thiago:#5CCB8A; --marcelo:#C068A6; --gabriel:#F0905A; --adriano:#4FC3D6; --breno:#F074B4; --tbd:#93A0B5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin-inline:auto}
.wrap.wide{max-width:1000px}
.tnum{font-variant-numeric:tabular-nums}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px 6px}
.parish{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;min-height:36px}

/* barra de filtros */
.fbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px;display:flex;gap:8px;align-items:center}
.fbar .scroll{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.fbar .scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;white-space:nowrap;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .dot{box-shadow:0 0 0 2px var(--surface)}
.fbtn{flex:none;position:relative}
.fbtn .n{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:12px;text-align:center;margin-left:6px}
.panel{display:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.panel.open{display:flex}
.panel h3{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:42px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0;text-align:left;text-decoration:underline;text-underline-offset:3px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--tbd);display:inline-block;flex:none}

/* próxima celebração */
.next{background:var(--accent);color:var(--on-accent);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin-top:6px}
.next .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.next .when{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.05;margin-top:4px}
.next .where{margin-top:4px;font-weight:600;font-size:17px}
.next .who{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.next .who .dot{background:var(--on-accent);opacity:.9}
.next .obs{margin-top:2px;font-size:14px;opacity:.9}
.next.empty{background:var(--surface);color:var(--fg);border:1px solid var(--line)}

/* destaques */
.feast{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:2px 16px}
.feast::-webkit-scrollbar{display:none}
.feast button{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:var(--gold-bg);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:12px;padding:8px 12px;max-width:230px}
.feast .d{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.feast .t{font-weight:600;font-size:14px;line-height:1.2}

/* seções e dias */
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec h2{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec span{font-size:14px;color:var(--muted)}
.day{margin-bottom:14px;scroll-margin-top:70px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-width:0}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2)}
.dhead .t{min-width:0}
.dhead .rel{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.1}
.dhead .dt{font-size:14px;color:var(--muted)}
.dhead .sp{display:block;color:var(--gold);font-weight:700;font-size:14px;margin-top:1px}
.day.sun .rel{color:var(--accent)}
.day.today .dcard{border-color:var(--accent);box-shadow:var(--shadow)}
.day.today .dhead{background:var(--accent);color:var(--on-accent)}
.day.today .dhead .dt,.day.today .dhead .sp{color:inherit;opacity:.92}
.day.today .dhead .rel{font-size:30px}
.day.today .copy{border-color:color-mix(in srgb,var(--on-accent) 55%,transparent);color:inherit}
.copy{flex:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.item{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.dhead + .item{border-top:0}
.item .h{font-weight:700;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}
.item .loc{font-weight:600;font-size:17px;line-height:1.25}
.item .sub{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:3px;font-size:15px;color:var(--muted)}
.item .sub b{color:var(--fg);font-weight:600}
.item .obs{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.item.past{opacity:.5}
.item.next-it{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px;letter-spacing:.03em;vertical-align:middle;text-transform:uppercase}
.tag.sol{background:var(--gold-bg);color:var(--gold)}
.tag.sac{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tag.out{background:var(--surface2);color:var(--muted)}
.tag.nx{background:var(--accent);color:var(--on-accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.morebtn{width:100%;margin-top:4px}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}
.cal .wh{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{aspect-ratio:1/1.05;min-height:50px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:4px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-width:0}
.cell.blank{visibility:hidden}
.cell .num{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1}
.cell .dots{display:flex;flex-wrap:wrap;gap:2px}
.cell .dots .dot{width:5px;height:5px}
.cell.dim{opacity:.4}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cell.sel .dot{box-shadow:0 0 0 1.5px var(--on-accent)}
.cell .star{color:var(--gold);font-size:12px;font-weight:700;line-height:1}
.cell.sel .star{color:inherit}
.cellrow{display:flex;justify-content:space-between;align-items:flex-start}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0 4px;color:var(--muted);font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.detail h3{font-family:var(--font-display);font-size:24px;margin:18px 0 10px}

/* comunidades e padres */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{font-family:var(--font-display);font-size:23px;line-height:1.15;margin:0}
.card .sub{color:var(--muted);font-size:14px;margin-top:2px}
.big{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1}
.big small{font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.patterns{display:flex;flex-wrap:wrap;gap:6px}
.pat{font-size:14px;padding:4px 10px;border-radius:8px;background:var(--surface2);font-variant-numeric:tabular-nums}
.pat b{font-weight:700}
.pat.once{background:none;border:1px dashed var(--line);color:var(--muted)}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.bar i{display:block;height:100%;background:var(--pc)}
.strip{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:2px}
.strip i{height:22px;border-radius:3px;background:var(--surface2)}
.strip i.on{background:var(--pc)}
.strip i.sun{outline:1px solid var(--muted);outline-offset:-1px}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.kv b{color:var(--fg);font-variant-numeric:tabular-nums}
.pagetitle{font-family:var(--font-display);font-size:30px;font-weight:700;margin:14px 0 2px}
.note{margin-top:24px;color:var(--muted);font-size:14px;max-width:70ch}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:720px}
.tab{background:none;border:0;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);min-height:50px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (min-width:700px){
  .next .when{font-size:42px}
  .cell{min-height:70px;padding:7px 8px}
  .cell .num{font-size:20px}
  .cell .dots .dot{width:7px;height:7px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

};
var FEASTS=[[1,"Solenidade de Todos os Santos"],[2,"Fiéis Defuntos"],[24,"Tríduo de N. Sra. das Graças · 1º dia"],[25,"Tríduo · 2º dia"],[26,"Tríduo · 3º dia"],[27,"Solenidade de N. Sra. das Graças"],[28,"Cerco de Jericó · 1º dia"],[29,"Cerco de Jericó · 2º dia"],[30,"Cerco de Jericó · 3º dia"]];
var SPECIAL={}; FEASTS.forEach(function(f){SPECIAL[f[0]]=f[1]});

var DAYS=[], ALL=[];
for(var d=1; d<=30; d++){
  var dt=new Date(2026,10,d), items=RAW[d].map(function(r){
    var m=/(\d+)h(\d+)?/.exec(r[0]), min=(+m[1])*60+(+(m[2]||0));
    var o=r[4]||"";
    var it={d:d,wd:dt.getDay(),h:r[0],min:min,l:r[1],t:r[2],p:r[3],o:o,
      sol:/solenidade|tríduo/i.test(o), vot:/votiva/i.test(o), mar:o===MARIANO};
    it.when=new Date(2026,10,d,Math.floor(min/60),min%60);
    return it;
  }).sort(function(a,b){return a.min-b.min});
  DAYS.push({d:d,wd:dt.getDay(),items:items}); ALL=ALL.concat(items);
}

/* ---------- estado ---------- */
var S={v:"agenda",pad:{},tipo:{},loc:"",per:"",esp:"",q:"",sel:null,open:false,past:false};
var now=new Date(), inMonth=now.getFullYear()===2026&&now.getMonth()===10;
var TODAY=inMonth?now.getDate():0;
S.sel=TODAY||1;

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pad2(n){return n<10?"0"+n:""+n}
function pc(p){return "var("+PADRES[p].c+")"}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function periodo(min){return min<720?"m":(min<1080?"t":"n")}
function nPad(){return Object.keys(S.pad).filter(function(k){return S.pad[k]})}
function nTipo(){return Object.keys(S.tipo).filter(function(k){return S.tipo[k]})}

function match(it){
  var np=nPad(); if(np.length && !S.pad[it.p]) return false;
  var nt=nTipo(); if(nt.length && !S.tipo[it.t]) return false;
  if(S.loc && it.l!==S.loc) return false;
  if(S.per && periodo(it.min)!==S.per) return false;
  if(S.esp==="sol" && !it.sol) return false;
  if(S.esp==="sac" && it.t==="m") return false;
  if(S.esp==="vot" && !it.vot) return false;
  if(S.q){
    var hay=(LOCAIS[it.l].n+" "+PADRES[it.p].n+" "+it.o+" "+TIPOS[it.t]).toLowerCase();
    var qs=S.q.toLowerCase().split(/\s+/).filter(Boolean);
    for(var i=0;i<qs.length;i++){ if(hay.indexOf(qs[i])<0) return false }
  }
  return true;
}
function filtered(){return DAYS.map(function(D){return {d:D.d,wd:D.wd,items:D.items.filter(match)}})}
function nActive(){return (S.q?1:0)+(S.loc?1:0)+(S.per?1:0)+(S.esp?1:0)+nPad().length+nTipo().length}

/* ---------- rótulos de data ---------- */
function relDay(d){
  if(TODAY&&d===TODAY) return "Hoje";
  if(TODAY&&d===TODAY+1) return "Amanhã";
  return cap(WD[new Date(2026,10,d).getDay()]);
}
function dateLine(d){return WD[new Date(2026,10,d).getDay()]+", "+d+" de novembro"}
function countdown(when){
  var m=Math.round((when-new Date())/60000);
  if(m<=0) return "agora";
  if(m<60) return "em "+m+" min";
  if(m<1440){var h=Math.floor(m/60), r=m%60; return "em "+h+"h"+(r?pad2(r):"")}
  return "";
}

/* ---------- itens ---------- */
function itemHTML(it,cls){
  var L=LOCAIS[it.l], tags="";
  if(cls&&cls.indexOf("next-it")>=0) tags+='<span class="tag nx">Próxima</span>';
  if(it.sol) tags+='<span class="tag sol">Solenidade</span>';
  if(it.t!=="m") tags+='<span class="tag sac">'+TIPOS[it.t]+'</span>';
  if(L.ext) tags+='<span class="tag out">Fora da paróquia</span>';
  var obs=it.o?(it.t==="c"?"Noivos: "+esc(it.o):esc(it.o)):"";
  return '<div class="item'+(cls?" "+cls:"")+'"><span class="h">'+it.h+'</span><div><div class="loc">'+tags+esc(L.n)+'</div>'+
    '<div class="sub"><span class="dot" style="background:'+pc(it.p)+'"></span><b>'+PADRES[it.p].n+'</b></div>'+(obs?'<span class="obs">'+obs+'</span>':'')+'</div></div>';
}
function dayText(D){
  var t=cap(WD[D.wd])+", "+pad2(D.d)+"/11/2026\n";
  D.items.forEach(function(i){
    t+="• "+i.h+" – "+LOCAIS[i.l].n+" – "+(i.t==="m"?"Missa":TIPOS[i.t])+" – "+PADRES[i.p].n+(i.o?" ("+(i.t==="c"?"Noivos: ":"")+i.o+")":"")+"\n";
  });
  return t+"Paróquia São Judas Tadeu";
}
function dayBlock(D,opts){
  opts=opts||{};
  var isToday=D.d===TODAY, past=TODAY&&D.d<TODAY;
  var nextIdx=-1;
  if(isToday){ for(var i=0;i<D.items.length;i++){ if(D.items[i].when>=now){nextIdx=i;break} } }
  var body=D.items.map(function(it,i){
    var c=isToday?(it.when<now?"past":(i===nextIdx?"next-it":"")):"";
    return itemHTML(it,c);
  }).join("");
  var sp=SPECIAL[D.d]?'<span class="sp">'+esc(SPECIAL[D.d])+'</span>':'';
  return '<section class="day'+(isToday?" today":"")+(D.wd===0?" sun":"")+(past?" pastday":"")+'" id="dia-'+D.d+'"><div class="dcard"><div class="dhead"><div class="t"><div class="rel">'+relDay(D.d)+'</div><div class="dt">'+dateLine(D.d)+'</div>'+sp+'</div><button type="button" class="copy" data-copy="'+D.d+'">Copiar</button></div>'+body+'</div></section>';
}

/* ---------- próxima celebração ---------- */
function nextHTML(){
  var ref=TODAY?new Date():new Date(2026,10,1,0,0);
  var nx=ALL.filter(function(i){return i.when>=ref && match(i)})[0];
  if(!nx) return '<div class="next empty"><div class="lbl">Agenda de novembro</div><div class="when">Sem próximas celebrações</div><div class="obs" style="margin-top:6px;color:var(--muted)">'+(nActive()?"Nenhuma celebração futura com os filtros atuais.":"Todas as celebrações do quadro já aconteceram.")+'</div></div>';
  var cd=TODAY?countdown(nx.when):"";
  return '<div class="next"><div class="lbl"><span>'+(TODAY?"Próxima celebração":"Primeira celebração do mês")+'</span><span>'+cd+'</span></div>'+
    '<div class="when">'+(nx.d===TODAY?"Hoje":(nx.d===TODAY+1?"Amanhã":WDS[nx.wd]+", "+nx.d+"/11"))+' · '+nx.h+'</div>'+
    '<div class="where">'+esc(LOCAIS[nx.l].n)+(nx.t!=="m"?' · '+TIPOS[nx.t]:'')+'</div>'+
    '<div class="who"><span class="dot"></span>'+PADRES[nx.p].n+'</div>'+
    (nx.o&&!nx.mar&&nx.t!=="c"?'<div class="obs">'+esc(nx.o)+'</div>':'')+(nx.mar?'<div class="obs">'+MARIANO+'</div>':'')+'</div>';
}
function feastHTML(){
  var f=FEASTS.filter(function(x){return !TODAY||x[0]>=TODAY});

    return '<button type="button" data-go="'+x[0]+'"><span class="d">'+(TODAY&&x[0]===TODAY?"Hoje":(TODAY&&x[0]===TODAY+1?"Amanhã":pad2(x[0])+"/11 · "+WDS[new Date(2026,10,x[0]).getDay()]))+'</span><span class="t">'+esc(x[1])+'</span></button>';
  }).join("")+'</div>';

/* ---------- filtros ---------- */
function renderFilters(){
  $("fPad").innerHTML=Object.keys(PADRES).filter(function(k){return k!=="X"}).map(function(k){
    return '<button type="button" class="chip" data-pad="'+k+'" aria-pressed="'+!!S.pad[k]+'"><span class="dot" style="background:var('+PADRES[k].c+')"></span>'+PADRES[k].n+'</button>';
  }).join("");
  var counts={}; ALL.forEach(function(i){counts[i.l]=(counts[i.l]||0)+1});
  $("fLoc").innerHTML='<option value="">Todas as comunidades</option>'+Object.keys(LOCAIS).sort(function(a,b){return LOCAIS[a].n.localeCompare(LOCAIS[b].n,"pt")}).map(function(k){
    return '<option value="'+k+'"'+(S.loc===k?' selected':'')+'>'+esc(LOCAIS[k].n)+' ('+counts[k]+')</option>';
  }).join("");
  var per=[["","Todos"],["m","Manhã"],["t","Tarde"],["n","Noite"]];
  $("fPer").innerHTML=per.map(function(p){return '<button type="button" class="chip" data-per="'+p[0]+'" aria-pressed="'+(S.per===p[0])+'">'+p[1]+'</button>'}).join("");
  $("fTipo").innerHTML=Object.keys(TIPOS).map(function(k){return '<button type="button" class="chip" data-tipo="'+k+'" aria-pressed="'+!!S.tipo[k]+'">'+TIPOS[k]+'</button>'}).join("");
  var esp=[["","Todos"],["sol","Solenidades e tríduo"],["sac","Sacramentos"],["vot","Missas votivas"]];
  $("fEsp").innerHTML=esp.map(function(p){return '<button type="button" class="chip" data-esp="'+p[0]+'" aria-pressed="'+(S.esp===p[0])+'">'+p[1]+'</button>'}).join("");
  var n=nActive(), c=$("fcount"); c.hidden=!n; c.textContent=n;
  $("clear").hidden=!n;
}

/* ---------- visões ---------- */
function viewAgenda(){
  var F=filtered(), html=nextHTML()+feastHTML(), start=TODAY||1;
  if(TODAY){
    var T=F[TODAY-1];
    html+='<div class="sec"><h2>Hoje</h2></div>';
    html+=T.items.length?dayBlock(T):'<div class="empty" id="dia-'+TODAY+'">'+(nActive()?"Nenhuma celebração hoje com os filtros atuais.":"Sem celebrações hoje.")+'</div>';
    start=TODAY+1;
  }
  var up=F.filter(function(D){return D.d>=start&&D.items.length});
  var upN=0; up.forEach(function(D){upN+=D.items.length});
  html+='<div class="sec"><h2>'+(TODAY?"Próximos dias":"Todos os dias")+'</h2><span class="tnum">'+upN+' celebrações</span></div>';
  html+=up.length?up.map(function(D){return dayBlock(D)}).join(""):'<div class="empty">Nenhuma celebração encontrada.'+(nActive()?'<br><button type="button" class="linkbtn" data-clear="1">Limpar filtros</button>':'')+'</div>';
  if(TODAY>1){
    var pastDays=F.filter(function(D){return D.d<TODAY&&D.items.length});
    if(pastDays.length){
      html+='<div class="sec"><h2>Dias anteriores</h2><span class="tnum">'+pastDays.length+' dias</span></div>';
      html+=S.past?pastDays.map(function(D){return dayBlock(D)}).join("")+'<button type="button" class="iconbtn morebtn" data-past="0">Ocultar dias anteriores</button>'
                  :'<button type="button" class="iconbtn morebtn" data-past="1">Mostrar dias anteriores</button>';
    }
  }
  return html;
}
function viewCal(){
  var F=filtered(), html='<div class="cal">';
  WDS.forEach(function(w){html+='<div class="wh">'+w.charAt(0)+'</div>'});
    F.forEach(function(D){
    var cls="cell"+(D.items.length?"":" dim")+(D.d===TODAY?" today":"")+(D.d===S.sel?" sel":"");
    var dots=D.items.slice(0,12).map(function(i){return '<span class="dot" style="background:'+pc(i.p)+'"></span>'}).join("");
    html+='<button type="button" class="'+cls+'" data-sel="'+D.d+'" aria-label="Dia '+D.d+', '+D.items.length+' celebrações"><span class="cellrow"><span class="num tnum">'+D.d+'</span>'+(SPECIAL[D.d]?'<span class="star">★</span>':'')+'</span><span class="dots">'+dots+'</span></button>';
  });
  html+='</div><div class="legend">'+Object.keys(PADRES).map(function(k){return '<span><i class="dot" style="background:var('+PADRES[k].c+')"></i>'+PADRES[k].n+'</span>'}).join("")+'<span><b style="color:var(--gold)">★</b> Data especial</span></div>';
  var D=F[S.sel-1];
  html+='<section class="detail"><h3>'+cap(dateLine(D.d))+'</h3>';
  html+=D.items.length?'<div class="dcard"><div class="dhead"><div class="t">'+(SPECIAL[D.d]?'<span class="sp" style="margin:0">'+esc(SPECIAL[D.d])+'</span>':'<span class="dt">'+D.items.length+(D.items.length===1?" celebração":" celebrações")+'</span>')+'</div><button type="button" class="copy" data-copy="'+D.d+'">Copiar</button></div>'+D.items.map(function(i){return itemHTML(i,i.d===TODAY&&i.when<now?"past":"")}).join("")+'</div>':'<div class="empty">Sem celebrações neste dia'+(nActive()?' com os filtros atuais':'')+'.</div>';
  return html+'</section>';
}
function patternsFor(k){
  var m={};
  ALL.filter(function(i){return i.l===k}).forEach(function(i){
    var key=i.wd+"|"+i.min; (m[key]=m[key]||{wd:i.wd,h:i.h,min:i.min,n:0,tipos:{}}).n++; m[key].tipos[i.t]=1;
  });
  return Object.keys(m).map(function(x){return m[x]}).sort(function(a,b){return ((a.wd+6)%7)-((b.wd+6)%7)||a.min-b.min});
}
function viewLoc(){
  var keys=Object.keys(LOCAIS).sort(function(a,b){
    return ALL.filter(function(i){return i.l===b}).length-ALL.filter(function(i){return i.l===a}).length;
  });
  var html='<h2 class="pagetitle">Comunidades</h2><div class="cards">';
  keys.forEach(function(k){
    var its=ALL.filter(function(i){return i.l===k}), L=LOCAIS[k], by={};
    its.forEach(function(i){by[i.p]=(by[i.p]||0)+1});
    var bar=Object.keys(by).map(function(p){return '<i style="--pc:var('+PADRES[p].c+');width:'+(by[p]/its.length*100)+'%" title="'+PADRES[p].n+': '+by[p]+'"></i>'}).join("");
    var pats=patternsFor(k).map(function(p){
      var tag=Object.keys(p.tipos).some(function(t){return t!=="m"})?" *":"";
      return '<span class="pat'+(p.n===1?' once':'')+'"><b>'+WDP[p.wd]+'</b> '+p.h+(p.n>1?' ×'+p.n:'')+tag+'</span>';
    }).join("");
    var leg=Object.keys(by).map(function(p){return '<span><b>'+by[p]+'</b> '+PADRES[p].n.replace("Pe. ","")+'</span>'}).join("");
    html+='<article class="card"><div><h3>'+esc(L.n)+'</h3><div class="sub">'+(L.ext?'Fora da paróquia':'Comunidade da paróquia')+'</div></div>'+
      '<div class="big tnum">'+its.length+'<small>celebrações no mês</small></div>'+
      '<div><div class="sub" style="margin-bottom:6px">Horários (× = vezes no mês; tracejado = ocorrência única)</div><div class="patterns">'+pats+'</div></div>'+
      '<div><div class="bar">'+bar+'</div><div class="kv" style="margin-top:8px">'+leg+'</div></div>'+
      '<button type="button" class="iconbtn" data-loc="'+k+'">Ver na agenda</button></article>';
  });
  return html+'</div><p class="note">* inclui celebração que não é missa (matrimônio, batizados ou carreata).</p>';
}
function viewPad(){
  var html='<h2 class="pagetitle">Padres</h2><div class="cards">';
  Object.keys(PADRES).forEach(function(k){
    var its=ALL.filter(function(i){return i.p===k}); if(!its.length) return;
    var days={}, locs={}, tp={}, sol=0;
    its.forEach(function(i){days[i.d]=1; locs[i.l]=(locs[i.l]||0)+1; tp[i.t]=(tp[i.t]||0)+1; if(i.sol) sol++});
    var top=Object.keys(locs).sort(function(a,b){return locs[b]-locs[a]}).slice(0,4);
    var strip=""; for(var d=1;d<=30;d++){var wd=new Date(2026,10,d).getDay(); strip+='<i class="'+(days[d]?'on':'')+(wd===0?' sun':'')+'" title="'+pad2(d)+'/11'+(days[d]?' · celebra':'')+'"></i>'}
    var tps=Object.keys(tp).filter(function(t){return t!=="m"}).map(function(t){return '<span><b>'+tp[t]+'</b> '+TIPOS[t].toLowerCase()+'</span>'}).join("");
    html+='<article class="card" style="--pc:var('+PADRES[k].c+')"><div><h3 style="display:flex;align-items:center;gap:10px"><span class="dot" style="background:var(--pc);width:14px;height:14px"></span>'+PADRES[k].n+'</h3>'+(k==="X"?'<div class="sub">Celebração sem padre indicado no quadro</div>':'')+'</div>'+
      '<div class="big tnum">'+its.length+'<small>celebrações em '+Object.keys(days).length+' dias</small></div>'+
      '<div><div class="sub" style="margin-bottom:6px">Dias do mês (domingos com contorno)</div><div class="strip">'+strip+'</div></div>'+
      '<div><div class="sub" style="margin-bottom:6px">Onde mais celebra</div><div class="kv">'+top.map(function(l){return '<span><b>'+locs[l]+'</b> '+esc(LOCAIS[l].n)+'</span>'}).join("")+'</div></div>'+
      (tps||sol?'<div class="kv">'+tps+(sol?'<span><b>'+sol+'</b> em solenidades</span>':'')+'</div>':'')+
      (k!=="X"?'<button type="button" class="iconbtn" data-padgo="'+k+'">Ver na agenda</button>':'')+'</article>';
  });
  return html+'</div>';
}

/* ---------- render ---------- */
function render(){
  now=new Date();
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){t.setAttribute("aria-selected",t.dataset.v===S.v)});
  var full=S.v==="loc"||S.v==="pad";
  $("wrap").className="wrap"+(full?" wide":"");
  $("fbar").hidden=full; if(full){$("panel").classList.remove("open")}
  else $("panel").classList.toggle("open",S.open);
  $("fbar").style.display=full?"none":"";
  renderFilters();
  $("view").innerHTML=S.v==="agenda"?viewAgenda():S.v==="cal"?viewCal():S.v==="loc"?viewLoc():viewPad();
}
function setView(v){S.v=v;render();window.scrollTo(0,0)}
function clearAll(){S.pad={};S.tipo={};S.loc="";S.per="";S.esp="";S.q="";$("q").value=""}
function goDay(d){
  S.v="agenda";
  if(TODAY&&d<TODAY) S.past=true;
  if(!filtered()[d-1].items.length) clearAll();
  render();
  var el=$("dia-"+d); if(el){el.scrollIntoView({behavior:"smooth",block:"start"})}
}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},1800)}
function copyText(text){
  function fb(){var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);toast(ok?"Copiado":"Selecione e copie manualmente")}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast("Copiado")},fb)}else fb();
}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  var ds=b.dataset;
  if(ds.v){setView(ds.v);return}
  if(ds.go){goDay(+ds.go);return}
  if(ds.pad){S.pad[ds.pad]=!S.pad[ds.pad];render();return}
  if(ds.tipo){S.tipo[ds.tipo]=!S.tipo[ds.tipo];render();return}
  if(ds.per!==undefined){S.per=ds.per;render();return}
  if(ds.esp!==undefined){S.esp=ds.esp;render();return}
  if(ds.sel){S.sel=+ds.sel;render();return}
  if(ds.past!==undefined){S.past=ds.past==="1";render();return}
  if(ds.copy){copyText(dayText(DAYS[+ds.copy-1]));return}
  if(ds.loc){clearAll();S.loc=ds.loc;S.v="agenda";S.open=true;render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(ds.padgo){clearAll();S.pad[ds.padgo]=true;S.v="agenda";render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(b.id==="clear"||ds.clear){clearAll();render();return}
  if(b.id==="ftoggle"){S.open=!S.open;b.setAttribute("aria-expanded",S.open);$("panel").classList.toggle("open",S.open);return}
  if(b.id==="theme"){
    var cur=document.documentElement.getAttribute("data-theme");
    var dark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme:dark)").matches;
    var nx=dark?"light":"dark"; document.documentElement.setAttribute("data-theme",nx);
    try{localStorage.setItem("missas-tema",nx)}catch(_){}
  }
});
$("q").addEventListener("input",function(e){S.q=e.target.value.trim();$("view").innerHTML=S.v==="cal"?viewCal():viewAgenda();var n=nActive(),c=$("fcount");c.hidden=!n;c.textContent=n;$("clear").hidden=!n});
$("fLoc").addEventListener("change",function(e){S.loc=e.target.value;render()});

try{var th=localStorage.getItem("missas-tema"); if(th) document.documentElement.setAttribute("data-theme",th)}catch(_){}
render();
/* atualiza "hoje", "próxima" e a contagem sem mexer na rolagem */
setInterval(function(){ if(S.v==="agenda"&&!document.hidden){var y=window.scrollY;render();window.scrollTo(0,y)} },60000);
})();
